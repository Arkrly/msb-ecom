spring.application.name=auth-service
server.port=${SERVER_PORT:8085}

# ─── Actuator ────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,liveness,readiness
management.endpoint.health.show-details=always

# ─── PostgreSQL ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${AUTH_DB_HOST:localhost}:5432/${AUTH_DB_NAME:auth_service}
spring.datasource.username=${AUTH_DB_USER:auth}
spring.datasource.password=${AUTH_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ─────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Flyway ──────────────────────────────────────────────────────────
spring.flyway.enabled=true

# ─── JWT Configuration ───────────────────────────────────────────────
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=3600000

# ─── Logging ─────────────────────────────────────────────────────────
logging.level.com.msb.ecom.auth_service=DEBUG
